<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Core Dark Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" />
  
  <!-- Inner Shield Surface -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#coreGrad)" />

  <!-- Iconic Ascending Industry Wings / Precision Step Graphic -->
  <g filter="url(#glow)">
    <!-- Left Ascending Bar (Step 1) -->
    <path d="M120 340 L168 340 L168 250 L120 280 Z" fill="#38bdf8" opacity="0.85" />
    
    <!-- Middle Ascending Bar (Step 2) -->
    <path d="M192 340 L240 340 L240 190 L192 220 Z" fill="#0ea5e9" />
    
    <!-- Right Victory Arrow & Checkmark (Step 3 to Success) -->
    <path d="M264 340 L312 340 L392 140 L328 140 L264 290 Z" fill="url(#accentGrad)" />

    <!-- Top Floating Precision Diamond -->
    <polygon points="392,100 420,128 392,156 364,128" fill="#34d399" />
  </g>

  <!-- Lettering 'SMK' Monogram at Bottom -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    SMK
  </text>
</svg>
